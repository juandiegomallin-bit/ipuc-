<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Administrar página</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--sky:#5AACDE;--dark:#2E7FB0;--pale:#EAF6FD;--text:#1A2F3E;--muted:#4F7A94;--line:#cfe3f1}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',sans-serif;color:var(--text);background:#f4faff;min-height:100vh}
button,input,textarea{font:inherit}
button,.btn{background:var(--dark);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:.9rem}
button.sec,.btn.sec{background:#fff;color:var(--dark);border:1.5px solid var(--line)}
button.danger{background:#fff;color:#b3261e;border:1.5px solid #f0c5c2}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#login{display:grid;place-items:center;min-height:100vh;padding:20px}
#login form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;width:min(380px,100%);display:grid;gap:14px}
#login h1{font-size:1.3rem}
#err{color:#b3261e;min-height:1.2em;font-size:.9rem}
input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
#app{display:none}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin-right:auto}
#estado{color:var(--muted);font-size:.85rem}
.wrap{display:grid;grid-template-columns:220px 1fr;gap:24px;max-width:1000px;margin:0 auto;padding:24px 20px}
nav{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:80px}
nav button{background:transparent;color:var(--text);text-align:left;font-weight:600}
nav button[aria-current=true]{background:var(--pale);color:var(--dark)}
main{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:16px;align-content:start}
main h2{font-size:1.4rem}
.f{display:grid;gap:6px}
label{font-weight:700;font-size:.88rem}
fieldset{border:1.5px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
legend{font-weight:700;color:var(--dark);padding:0 8px}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.acc button{padding:6px 12px;font-size:.82rem}
.img{display:grid;gap:8px;justify-items:start}
.img img{max-width:220px;max-height:140px;border-radius:10px;border:1px solid var(--line)}
.ayuda{color:var(--muted);font-size:.9rem;line-height:1.5}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;position:static}nav button{white-space:nowrap}}
</style>
</head>
<body>

<div id="login">
  <form id="fl">
    <h1>Administrar página</h1>
    <div class="f"><label for="pw">Contraseña</label><input type="password" id="pw" autocomplete="current-password" autofocus/></div>
    <p id="err" role="alert"></p>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app">
  <header>
    <h1>Administrar página</h1>
    <span id="estado"></span>
    <a class="btn sec" href="index.html" target="_blank">Ver sitio</a>
    <button id="exp">Descargar contenido.js</button>
    <button class="sec" id="desc">Descartar borrador</button>
    <button class="sec" id="salir">Salir</button>
  </header>
  <div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
</div>

<script src="contenido.js"></script>
<script>
var KEY = 'ipuc_borrador', base = window.CONTENIDO_BASE;
var $ = function (s) { return document.querySelector(s); };
var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var data; try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
data = data || clone(base);

var get = function (p) { return p.split('.').reduce(function (o, k) { return o[k]; }, data); };
var set = function (p, v) { var a = p.split('.'), k = a.pop(); a.reduce(function (o, x) { return o[x]; }, data)[k] = v; };

var sha = async function (s) {
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b), function (x) { return x.toString(16).padStart(2, '0'); }).join('');
};

var ICO = ['icono', 'Ícono (emoji)'];
var S = [
  { id: 'iglesia', t: 'Iglesia y logo', o: 'iglesia', f: [['nombre', 'Nombre'], ['ciudad', 'Ciudad'], ['denominacion', 'Denominación'], ['subtitulo', 'Subtítulo de la portada'], ['ubicacionPie', 'Ubicación (pie de página)'], ['logo', 'Logo', 'img']] },
  { id: 'inicio', t: 'Portada', o: 'inicio', f: [['versiculo', 'Versículo', 'area'], ['referencia', 'Referencia'], ['bienvenida', 'Mensaje de bienvenida', 'area']] },
  { id: 'sobre', t: 'Sobre nosotros', l: 'sobre', n: 'Tarjeta', ti: 'titulo', lf: [ICO, ['titulo', 'Título'], ['texto', 'Texto', 'area']] },
  { id: 'familia', t: 'Familia pastoral', o: 'familia', f: [['foto', 'Foto de la familia', 'img'], ['pie', 'Título bajo la foto'], ['subpie', 'Nombres bajo la foto']], l: 'familia.miembros', n: 'Miembro', ti: 'nombre', lf: [ICO, ['nombre', 'Nombre'], ['rol', 'Rol']] },
  { id: 'ministerios', t: 'Ministerios', l: 'ministerios', n: 'Ministerio', ti: 'nombre', lf: [ICO, ['nombre', 'Nombre'], ['lider', 'Líder']] },
  { id: 'horarios', t: 'Horarios de culto', l: 'horarios', n: 'Horario', ti: 'dia', lf: [ICO, ['dia', 'Día'], ['hora', 'Hora']] },
  { id: 'predicaciones', t: 'Predicaciones', o: 'predicaciones', f: [['video', 'Enlace del video de YouTube']], ayuda: 'Pega el enlace del video. Si lo dejas vacío, la sección se oculta.' },
  { id: 'contacto', t: 'Contacto', o: 'contacto', f: [['direccion', 'Dirección', 'area'], ['mapa', 'Dirección para el mapa'], ['telefono', 'Teléfono'], ['correo', 'Correo electrónico'], ['bienvenida', 'Mensaje de bienvenida', 'area']] },
  { id: 'pie', t: 'Pie de página', o: 'pie', f: [['copyright', 'Texto de derechos']] },
  { id: 'seg', t: 'Contraseña' }
];
var cur = 'iglesia', timer;

function guardar() {
  $('#estado').textContent = 'Guardando…';
  clearTimeout(timer);
  timer = setTimeout(function () {
    try { localStorage.setItem(KEY, JSON.stringify(data)); $('#estado').textContent = 'Borrador guardado en este navegador'; }
    catch (e) { $('#estado').textContent = 'No se pudo guardar: la imagen es muy pesada'; }
  }, 300);
}

function fld(p, label, tipo, v) {
  if (tipo === 'area') return '<div class="f"><label>' + label + '<textarea data-p="' + p + '">' + esc(v) + '</textarea></label></div>';
  if (tipo === 'img') {
    var url = p.slice(-5) === '.logo' ? '<input type="text" data-p="' + p + '" value="' + esc(v) + '" placeholder="https://…" aria-label="Enlace de la imagen">' : '';
    return '<div class="f"><label>' + label + '</label><div class="img">' + (v ? '<img src="' + esc(v) + '" alt="">' : '<span class="ayuda">Se usa la imagen original del sitio.</span>') + url +
      '<input type="file" accept="image/*" data-img="' + p + '" aria-label="Subir imagen">' +
      (v && url === '' ? '<button class="sec" data-a="quitar" data-p="' + p + '">Volver a la foto original</button>' : '') + '</div></div>';
  }
  return '<div class="f"><label>' + label + '<input type="text" data-p="' + p + '" value="' + esc(v) + '"></label></div>';
}

function pintar() {
  var s = S.filter(function (x) { return x.id === cur; })[0], h = '<h2>' + s.t + '</h2>';
  if (s.ayuda) h += '<p class="ayuda">' + s.ayuda + '</p>';
  if (s.id === 'seg') {
    h += '<p class="ayuda">La contraseña solo evita curiosos: cualquiera que abra el código del sitio puede ver su huella. Para publicar los cambios hay que subir el archivo contenido.js al hosting.</p>' +
      '<div class="f"><label>Nueva contraseña<input type="password" id="p1" autocomplete="new-password"></label></div>' +
      '<div class="f"><label>Repetir contraseña<input type="password" id="p2" autocomplete="new-password"></label></div>' +
      '<div><button data-a="pw">Cambiar contraseña</button></div><p id="pwm" class="ayuda" role="status"></p>';
  } else {
    if (s.o) h += s.f.map(function (f) { return fld(s.o + '.' + f[0], f[1], f[2], get(s.o + '.' + f[0])); }).join('');
    if (s.l) {
      var arr = get(s.l);
      h += arr.map(function (it, i) {
        var b = 'data-l="' + s.l + '" data-i="' + i + '"';
        return '<fieldset><legend>' + s.n + ' ' + (i + 1) + (it[s.ti] ? ' · ' + esc(it[s.ti]) : '') + '</legend>' +
          s.lf.map(function (f) { return fld(s.l + '.' + i + '.' + f[0], f[1], f[2], it[f[0]]); }).join('') +
          '<div class="acc"><button class="sec" data-a="up" ' + b + '>Subir</button><button class="sec" data-a="down" ' + b + '>Bajar</button><button class="danger" data-a="del" ' + b + '>Eliminar</button></div></fieldset>';
      }).join('') + '<div><button data-a="add" data-l="' + s.l + '">Agregar ' + s.n.toLowerCase() + '</button></div>';
    }
  }
  $('#main').innerHTML = h;
  $('#nav').innerHTML = S.map(function (x) { return '<button data-s="' + x.id + '"' + (x.id === cur ? ' aria-current="true"' : '') + '>' + x.t + '</button>'; }).join('');
}

function redim(file, max, cb) {
  var r = new FileReader();
  r.onload = function () {
    var im = new Image();
    im.onload = function () {
      var k = Math.min(1, max / im.width), c = document.createElement('canvas'), png = file.type === 'image/png';
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL(png ? 'image/png' : 'image/jpeg', .82));
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

$('#main').addEventListener('input', function (e) {
  if (e.target.dataset.p) { set(e.target.dataset.p, e.target.value); guardar(); }
});
$('#main').addEventListener('change', function (e) {
  var p = e.target.dataset.img, f = e.target.files && e.target.files[0];
  if (p && f) redim(f, p.slice(-5) === '.logo' ? 300 : 1200, function (u) { set(p, u); guardar(); pintar(); });
});
$('#nav').addEventListener('click', function (e) { if (e.target.dataset.s) { cur = e.target.dataset.s; pintar(); } });
$('#main').addEventListener('click', async function (e) {
  var d = e.target.dataset, a = d.a;
  if (!a) return;
  if (a === 'pw') {
    var p1 = $('#p1').value, p2 = $('#p2').value, m = $('#pwm');
    if (p1.length < 6) { m.textContent = 'Usa al menos 6 caracteres.'; return; }
    if (p1 !== p2) { m.textContent = 'Las contraseñas no coinciden.'; return; }
    data.admin.hash = await sha(p1); guardar();
    m.textContent = 'Contraseña cambiada. Descarga contenido.js para que valga también en el sitio publicado.';
    return;
  }
  if (a === 'quitar') { set(d.p, null); guardar(); pintar(); return; }
  var arr = get(d.l), i = +d.i;
  if (a === 'add') { var n = {}; S.filter(function (x) { return x.l === d.l; })[0].lf.forEach(function (f) { n[f[0]] = ''; }); arr.push(n); }
  if (a === 'del' && confirm('¿Eliminar este elemento?')) arr.splice(i, 1);
  if (a === 'up' && i > 0) arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
  if (a === 'down' && i < arr.length - 1) arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
  guardar(); pintar();
});

$('#exp').onclick = function () {
  var b = new Blob(['/* Contenido publicado. Se regenera desde admin.html. */\nwindow.CONTENIDO_BASE = ' + JSON.stringify(data, null, 2) + ';\n'], { type: 'text/javascript' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'contenido.js'; a.click();
};
$('#desc').onclick = function () {
  if (confirm('Se perderán los cambios que no hayas descargado. ¿Descartar el borrador?')) { localStorage.removeItem(KEY); data = clone(base); pintar(); $('#estado').textContent = 'Borrador descartado'; }
};
$('#salir').onclick = function () { sessionStorage.removeItem('ipuc_ok'); location.reload(); };

function entrar() { $('#login').style.display = 'none'; $('#app').style.display = 'block'; pintar(); }
$('#fl').addEventListener('submit', async function (e) {
  e.preventDefault();
  if (!window.crypto || !crypto.subtle) { $('#err').textContent = 'Abre el admin desde https o localhost.'; return; }
  if (await sha($('#pw').value) === data.admin.hash) { sessionStorage.setItem('ipuc_ok', '1'); entrar(); }
  else $('#err').textContent = 'Contraseña incorrecta.';
});
if (sessionStorage.getItem('ipuc_ok')) entrar();
</script>
</body>
</html>
